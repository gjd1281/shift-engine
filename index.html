<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shift Engine">
<title>Shift Engine — Roster</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;transition:background .3s}
body{padding:14px 12px 40px;max-width:520px;margin:0 auto}
h1{font-size:17px;letter-spacing:.18em;text-transform:uppercase;margin:0;font-weight:800}
.sub{font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.crewtag{background:var(--hi);color:var(--onhi);font-size:11px;font-weight:800;padding:5px 9px;
  border-radius:5px;letter-spacing:.1em;text-transform:uppercase}
.card{position:relative;background:var(--panel);border:1px solid var(--edge);border-radius:16px;
  padding:14px;margin-bottom:12px;overflow:hidden;
  box-shadow:0 1px 0 var(--sheen) inset,0 10px 26px rgba(0,0,0,.18);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:42%;pointer-events:none;
  background:linear-gradient(180deg,var(--sheen),transparent)}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  margin-bottom:9px;font-weight:700;position:relative}
svg{display:block;width:100%;height:auto;position:relative}
#spinner{transform-origin:180px 192px;transition:transform 1.15s cubic-bezier(.16,.9,.24,1)}
#hubtap,#whyclear{cursor:pointer}
.strip{margin-bottom:10px}
.striptitle{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);
  font-weight:700;margin:0 0 5px 2px}
.themes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.themes::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:64px;border-radius:12px;border:2px solid transparent;cursor:pointer;padding:0;
  background:none;font-family:inherit}
.sw .chip{position:relative;height:30px;border-radius:9px;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.3),0 1px 0 rgba(255,255,255,.35) inset}
.sw .chip::after{content:"";position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,.42),transparent 55%)}
.sw i{position:absolute;top:0;bottom:0;display:block}
.sw b{display:block;font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
  margin-top:4px;font-weight:700;line-height:1.25}
.sw.on{border-color:var(--hi)}
.sw.on b{color:var(--hi)}
.status{text-align:center;padding:4px 0 2px;position:relative}
.stbig{font-size:25px;font-weight:800}
.stsub{font-size:12px;color:var(--mut);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:relative}
.dow{font-size:9px;color:var(--mut);text-align:center;font-weight:700}
.cell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-weight:800;font-size:15px;cursor:pointer;user-select:none;
  line-height:1;border:1px solid rgba(255,255,255,.26);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 -7px 14px rgba(0,0,0,.18) inset,0 3px 8px rgba(0,0,0,.22);
  transition:transform .07s}
.cell::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(157deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.1) 40%,
             rgba(255,255,255,0) 58%,rgba(0,0,0,.16) 100%)}
.cell:active{transform:scale(.9)}
.cell span{position:relative}
.cell .dn{font-size:8px;font-weight:600;opacity:.7;margin-top:2px;font-variant-numeric:tabular-nums}
.cell.today{border-color:var(--hi);box-shadow:0 0 0 2px var(--hi),0 1px 0 rgba(255,255,255,.5) inset,
  0 -7px 14px rgba(0,0,0,.18) inset}
.wk{font-size:9px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin:9px 0 4px;
  font-weight:700;position:relative}
.hint{font-size:11.5px;color:var(--mut);line-height:1.5;margin-top:10px;position:relative}
.btn{position:relative;display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--edge);
  font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:9px;
  overflow:hidden;font-family:inherit;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 4px 12px rgba(0,0,0,.2)}
.btn::before{content:"";position:absolute;inset:0 0 auto;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent)}
.btn.p{background:var(--hi);color:var(--onhi);border-color:transparent}
.btn.s{background:var(--panel2);color:var(--txt)}
.row{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap;position:relative}
input[type=date],input[type=text]{background:var(--panel2);border:1px solid var(--edge);color:var(--txt);
  border-radius:9px;padding:10px;font-size:14px;font-family:inherit;flex:1;min-width:130px}
.key{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px;position:relative;justify-content:center}
.k{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mut);background:var(--panel2);
  border:1px solid var(--edge);border-radius:20px;padding:4px 9px;font-weight:600}
.dot{width:12px;height:12px;border-radius:4px;display:inline-block;
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset}
.ov{position:fixed;inset:0;background:rgba(6,8,10,.86);display:none;align-items:center;justify-content:center;
  padding:18px;z-index:50;backdrop-filter:blur(6px)}
.ov.on{display:flex}
.sheet{background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:20px;max-width:400px;
  width:100%;max-height:88vh;overflow:auto;box-shadow:0 1px 0 var(--sheen) inset,0 20px 50px rgba(0,0,0,.5)}
.sheet h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}
.step{display:flex;gap:11px;margin-bottom:13px;font-size:13.5px;line-height:1.5}
.num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--hi);color:var(--onhi);font-size:11px;
  font-weight:800;display:flex;align-items:center;justify-content:center}
.warn{background:var(--warnbg);border-left:3px solid var(--hi);padding:10px 12px;border-radius:0 8px 8px 0;
  font-size:12.5px;line-height:1.5;margin:6px 0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--hi);color:var(--onhi);
  padding:12px 20px;border-radius:24px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#spinner{transition:none}}
</style>
</head>
<body>

<div class="strip"><div class="striptitle">Finish</div><div class="themes" id="rowBase"></div></div>
<div class="strip"><div class="striptitle">Team colours</div><div class="themes" id="rowTeam"></div></div>

<div class="hd">
  <div><h1>Roster</h1><div class="sub" id="sub">28-day cycle</div></div>
  <div class="crewtag" id="crewtag" style="display:none"></div>
</div>

<div class="card">
  <svg viewBox="0 0 360 384" id="wheel" aria-label="Roster wheel"></svg>
  <div class="status"><div class="stbig" id="stbig">—</div><div class="stsub" id="stsub"></div></div>
  <div class="key" id="key"></div>
</div>

<input type="file" id="whyFile" accept="image/*" style="display:none">

<div class="card">
  <div class="lbl">Paint your 28 days</div>
  <div class="grid" id="dow"></div>
  <div id="weeks"></div>
  <div class="hint">Tap a square to change it: <b>&#127969; &rarr; D &rarr; N &rarr; PJ &rarr; T</b> and back.
    Day 1 is today by default &mdash; just paint forward from where you are.</div>
  <div class="row">
    <input type="date" id="anchor">
    <input type="text" id="crew" placeholder="Crew name (optional)" maxlength="22">
  </div>
  <button class="btn s" id="clear">Clear all</button>
</div>

<button class="btn p" id="shareBtn">Share with crew</button>
<button class="btn s" id="saveBtn">Save to phone</button>

<div class="ov" id="ov"><div class="sheet">
  <h2>Save to phone</h2><div id="ovBody"></div>
  <button class="btn p" id="ovClose">Got it</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
function hex(c){c=c.replace('#','');return[parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)]}
function toHex(a){return'#'+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')}).join('')}
function shade(c,p){return toHex(hex(c).map(function(v){return p>0?v+(255-v)*p:v*(1+p)}))}
function mix(a,b,t){var A=hex(a),B=hex(b);return toHex([0,1,2].map(function(i){return A[i]+(B[i]-A[i])*t}))}
function rgba(c,a){var r=hex(c);return'rgba('+r[0]+','+r[1]+','+r[2]+','+a+')'}
function lum(c){var r=hex(c);return(.299*r[0]+.587*r[1]+.114*r[2])/255}
function ink(c){return lum(c)>.62?'#1E2229':'#FFFFFF'}

var C={D:'#FFA31A',N:'#4A72E8',P:'#B15CF5',T:'#17A2A2',H:'#2FBF5F'};
var BASE={
 standard:{name:'Standard',bg:'#12161A',panel:'rgba(30,37,44,.72)',panel2:'rgba(40,48,57,.8)',
   edge:'rgba(255,255,255,.11)',sheen:'rgba(255,255,255,.11)',txt:'#E8EDF2',mut:'#8A97A3',
   hub:'#1B2128',hi:'#FF6B1A',onhi:'#12161A',warnbg:'rgba(255,107,26,.12)',c:C,sw:['#FFA31A','#4A72E8','#17A2A2','#2FBF5F']},
 glass:{name:'Glass',bg:'#0B0F14',panel:'rgba(46,58,72,.42)',panel2:'rgba(56,70,86,.46)',
   edge:'rgba(255,255,255,.2)',sheen:'rgba(255,255,255,.2)',txt:'#EEF4FA',mut:'#93A3B3',
   hub:'#151D26',hi:'#48C8FF',onhi:'#04121A',warnbg:'rgba(72,200,255,.12)',c:C,sw:['#FFA31A','#4A72E8','#17A2A2','#2FBF5F']},
 hivis:{name:'Hi-Vis',bg:'#14171A',panel:'rgba(38,43,49,.75)',panel2:'rgba(48,54,61,.8)',
   edge:'rgba(255,255,255,.14)',sheen:'rgba(255,255,255,.14)',txt:'#F3F6F9',mut:'#96A1AC',
   hub:'#1D2228',hi:'#E4FF33',onhi:'#14180A',warnbg:'rgba(228,255,51,.13)',
   c:{D:'#FFB300',N:'#3E6BFF',P:'#C765FF',T:'#00C4C4',H:'#3BE86B'},sw:['#FFB300','#3E6BFF','#00C4C4','#3BE86B']},
 night:{name:'Night',bg:'#07090C',panel:'rgba(22,28,35,.8)',panel2:'rgba(30,37,45,.85)',
   edge:'rgba(255,255,255,.08)',sheen:'rgba(255,255,255,.06)',txt:'#C7D0D9',mut:'#6B7884',
   hub:'#10151B',hi:'#C8551A',onhi:'#0B0D10',warnbg:'rgba(200,85,26,.14)',
   c:{D:'#C97F17',N:'#3A5AB8',P:'#8A47C0',T:'#127F7F',H:'#249650'},sw:['#C97F17','#3A5AB8','#127F7F','#249650']},
 steel:{name:'Steel',bg:'#1A1F26',panel:'rgba(52,62,74,.7)',panel2:'rgba(62,74,88,.75)',
   edge:'rgba(255,255,255,.13)',sheen:'rgba(255,255,255,.13)',txt:'#E6EBF1',mut:'#93A0AD',
   hub:'#232B34',hi:'#7FA8D6',onhi:'#111820',warnbg:'rgba(127,168,214,.14)',c:C,sw:['#FFA31A','#4A72E8','#17A2A2','#2FBF5F']},
 daylight:{name:'Daylight',bg:'#E9EDF1',panel:'rgba(255,255,255,.78)',panel2:'rgba(255,255,255,.7)',
   edge:'rgba(60,80,100,.22)',sheen:'rgba(255,255,255,.85)',txt:'#1A2430',mut:'#69778A',
   hub:'#F2F5F8',hi:'#D95A0F',onhi:'#FFF6F0',warnbg:'rgba(217,90,15,.12)',
   c:{D:'#E8900A',N:'#3560D8',P:'#9C3FE0',T:'#0E8C8C',H:'#1FA24E'},sw:['#E8900A','#3560D8','#0E8C8C','#1FA24E']}
};
var TEAMS=[
 ['maroon-gold','Maroon &amp; Gold','#6A0021','#FFC72C'],
 ['purple-navy','Purple &amp; Navy','#5B2A86','#001A4B'],
 ['black-teal','Black &amp; Teal','#101214','#00A79D'],
 ['red-navy','Red &amp; Navy','#E4002B','#002B5C'],
 ['cardinal-myrtle','Cardinal &amp; Myrtle','#8E1B32','#0E4C2C'],
 ['maroon-white','Maroon &amp; White','#70142E','#F2F2F2'],
 ['blue-gold','Blue &amp; Gold','#0069B4','#FFD200'],
 ['sky-navy','Sky &amp; Navy','#00A9CE','#0A2240'],
 ['red-white','Red &amp; White','#D6001C','#F5F5F5'],
 ['blue-red','Blue &amp; Red','#00397B','#EE3124'],
 ['sky-gold','Sky &amp; Gold','#009FDF','#FDB913'],
 ['navy-sky','Navy &amp; Sky','#012B5D','#6CACE4'],
 ['lime-navy','Lime &amp; Navy','#7BC143','#0B2C4C'],
 ['black-red','Black &amp; Red','#121212','#C8102E'],
 ['black-orange','Black &amp; Orange','#151515','#F45C25'],
 ['blue-white','Blue &amp; White','#00539F','#F2F2F2'],
 ['red-gold','Red &amp; Gold','#DA1A32','#E8B33B']
];
function teamTheme(n,p,s){
  return {name:n,team:1,pri:p,sec:s,bg:mix(p,'#08090C',.88),panel:rgba(shade(p,.16),.2),
    panel2:rgba(shade(p,.2),.26),edge:'rgba(255,255,255,.13)',sheen:'rgba(255,255,255,.11)',
    txt:'#E9EEF4',mut:'#909DAA',hub:mix(p,'#0D1117',.76),
    hi:lum(s)>.75?shade(s,-.18):s,onhi:ink(s),warnbg:rgba(s,.14),c:C,sw:[p,s,p,s]};
}
var THEMES={};
Object.keys(BASE).forEach(function(k){THEMES[k]=BASE[k]});
TEAMS.forEach(function(t){THEMES[t[0]]=teamTheme(t[1],t[2],t[3])});
var BKEYS=Object.keys(BASE),TKEYS2=TEAMS.map(function(t){return t[0]});
var theme='standard';

var TYPES=['H','D','N','P','T'];
var GLYPH={H:'\uD83C\uDFE1',D:'D',N:'N',P:'PJ',T:'T'};
var NAME={H:'Home',D:'Day shift',N:'Night shift',P:'PJ day',T:'Travel'};
var KEYLBL={H:'\uD83C\uDFE1 Home',D:'D Day',N:'N Night',P:'PJ',T:'T Travel'};

var mem={};
function store(k,v){try{localStorage.setItem(k,v);return 1}catch(e){mem[k]=v;return 0}}
function fetchv(k){try{var v=localStorage.getItem(k);return v===null?(mem[k]||null):v}catch(e){return mem[k]||null}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}

var pattern=new Array(28).fill('H'),anchor=null,crew='',why=null,spun=false;
function TC(t){return THEMES[theme].c[t]}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseISO(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function midnight(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function dayDiff(a,b){return Math.round((b-a)/86400000)}
function cycleIdx(){var n=dayDiff(anchor,midnight())%28;return(n+28)%28}

function applyTheme(){
  var t=THEMES[theme],s=document.documentElement.style;
  ['bg','panel','panel2','edge','sheen','txt','mut','hi','onhi','warnbg'].forEach(function(k){s.setProperty('--'+k,t[k])});
  document.querySelector('meta[name=theme-color]').setAttribute('content',t.bg);
  store('se_theme',theme);
}
function swatchHTML(k){
  var t=THEMES[k],g='',n=t.sw.length,w=100/n;
  t.sw.forEach(function(c,i){g+='<i style="left:'+(i*w)+'%;width:'+w+'%;background:'+c+'"></i>'});
  return'<button class="sw'+(k===theme?' on':'')+'" data-t="'+k+'" aria-label="'+t.name+'">'+
        '<span class="chip" style="background:'+t.bg+'">'+g+'</span><b>'+t.name+'</b></button>';
}
function drawThemes(){
  document.getElementById('rowBase').innerHTML=BKEYS.map(swatchHTML).join('');
  document.getElementById('rowTeam').innerHTML=TKEYS2.map(swatchHTML).join('');
}
function drawKey(){
  var h='';
  TYPES.forEach(function(t){
    h+='<span class="k"><i class="dot" style="background:linear-gradient(160deg,'+shade(TC(t),.32)+','+
       shade(TC(t),-.22)+')"></i>'+KEYLBL[t]+'</span>';
  });
  document.getElementById('key').innerHTML=h;
}
function loadState(){
  var h=location.hash.slice(1),q={};
  h.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)q[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1))});
  var p=q.p||fetchv('se_pattern'),a=q.a||fetchv('se_anchor'),c=q.c||fetchv('se_crew')||'',th=fetchv('se_theme');
  if(th&&THEMES[th])theme=th;
  if(p&&/^[HDNPT]{28}$/.test(p))pattern=p.split('');
  anchor=(a&&/^\d{4}-\d{2}-\d{2}$/.test(a))?parseISO(a):midnight();
  crew=c; why=fetchv('se_why');
  if(q.p)setTimeout(function(){installSheet(true)},900);
}
function saveState(){store('se_pattern',pattern.join(''));store('se_anchor',iso(anchor));store('se_crew',crew)}

function pt(cx,cy,r,deg){var a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arc(cx,cy,r1,r2,a1,a2){
  var A=pt(cx,cy,r2,a1),B=pt(cx,cy,r2,a2),D2=pt(cx,cy,r1,a2),E=pt(cx,cy,r1,a1);
  return'M'+A[0].toFixed(2)+' '+A[1].toFixed(2)+'A'+r2+' '+r2+' 0 0 1 '+B[0].toFixed(2)+' '+B[1].toFixed(2)+
        'L'+D2[0].toFixed(2)+' '+D2[1].toFixed(2)+'A'+r1+' '+r1+' 0 0 0 '+E[0].toFixed(2)+' '+E[1].toFixed(2)+'Z';
}
function drawWheel(){
  var T=THEMES[theme],cx=180,cy=192,r1=94,r2=166,step=360/28,ci=cycleIdx(),rot=-(ci*step),today=midnight();
  var d='<defs>';
  TYPES.forEach(function(t){
    var c=TC(t);
    d+='<linearGradient id="g'+t+'" x1="0" y1="0" x2=".3" y2="1">'+
       '<stop offset="0" stop-color="'+shade(c,.4)+'"/><stop offset=".45" stop-color="'+c+'"/>'+
       '<stop offset="1" stop-color="'+shade(c,-.32)+'"/></linearGradient>';
  });
  d+='<linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
     '<radialGradient id="hub" cx=".4" cy=".22" r="1">'+
     '<stop offset="0" stop-color="'+shade(T.hub,.34)+'"/>'+
     '<stop offset=".55" stop-color="'+shade(T.hub,.04)+'"/>'+
     '<stop offset="1" stop-color="'+shade(T.hub,-.3)+'"/></radialGradient>'+
     '<clipPath id="hubclip"><circle cx="'+cx+'" cy="'+cy+'" r="88"/></clipPath>'+
     '<radialGradient id="scrim" cx=".5" cy=".5" r=".72">'+
     '<stop offset="0" stop-color="#000" stop-opacity=".72"/>'+
     '<stop offset=".62" stop-color="#000" stop-opacity=".42"/>'+
     '<stop offset="1" stop-color="#000" stop-opacity=".1"/></radialGradient></defs>';

  var g='<g id="spinner">';
  for(var i=0;i<28;i++){
    var t=pattern[i],a1=i*step+.8,a2=(i+1)*step-.8,mid=(a1+a2)/2,ic=ink(TC(t));
    var dt=addDays(today,(i-ci+28)%28),ly=cy-(r1+r2)/2,up=-(mid+rot);
    g+='<path d="'+arc(cx,cy,r1,r2,a1,a2)+'" fill="url(#g'+t+')"/>';
    g+='<path d="'+arc(cx,cy,r2-20,r2-1,a1,a2)+'" fill="url(#spec)" opacity=".7"/>';
    g+='<path d="'+arc(cx,cy,r1,r2,a1,a2)+'" fill="none" stroke="#fff" stroke-opacity=".2"/>';
    g+='<g transform="rotate('+mid.toFixed(2)+' '+cx+' '+cy+')">'+
       '<g transform="rotate('+up.toFixed(2)+' '+cx+' '+ly.toFixed(1)+')">'+
       '<text x="'+cx+'" y="'+(ly-1).toFixed(1)+'" text-anchor="middle" font-size="'+
       (t==='P'?11:t==='H'?13:15)+'" font-weight="800" fill="'+ic+'">'+GLYPH[t]+'</text>'+
       '<text x="'+cx+'" y="'+(ly+13).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="700" '+
       'opacity=".68" fill="'+ic+'">'+dt.getDate()+'</text></g></g>';
    if(i===ci)g+='<path d="'+arc(cx,cy,r1+1.5,r2-1.5,a1,a2)+'" fill="none" stroke="#fff" stroke-width="3" stroke-opacity=".95"/>';
  }
  g+='</g>';

  var t0=pattern[ci];
  var hub='<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="url(#hub)" stroke="'+T.edge+'"/>';
  if(why){
    hub+='<g clip-path="url(#hubclip)">'+
      '<image href="'+why+'" x="'+(cx-88)+'" y="'+(cy-88)+'" width="176" height="176" '+
      'preserveAspectRatio="xMidYMid slice"/>'+
      '<circle cx="'+cx+'" cy="'+cy+'" r="88" fill="url(#scrim)"/></g>';
  }
  if(T.team){
    hub+='<circle cx="'+cx+'" cy="'+cy+'" r="82" fill="none" stroke="'+T.pri+'" stroke-width="5"/>'+
         '<circle cx="'+cx+'" cy="'+cy+'" r="76" fill="none" stroke="'+T.sec+'" stroke-width="3"/>';
  }
  var lblc=why?'#FFFFFF':T.mut;
  hub+='<text x="'+cx+'" y="'+(cy-28)+'" text-anchor="middle" font-size="10" letter-spacing="2.6" fill="'+
       lblc+'" opacity="'+(why?'.9':'1')+'" font-weight="700">TODAY</text>'+
    '<text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="42" font-weight="800" fill="'+TC(t0)+'">'+GLYPH[t0]+'</text>'+
    '<text x="'+cx+'" y="'+(cy+37)+'" text-anchor="middle" font-size="11" fill="'+lblc+'" font-weight="600">'+NAME[t0]+'</text>';
  if(!why){
    hub+='<text x="'+cx+'" y="'+(cy+62)+'" text-anchor="middle" font-size="9.5" letter-spacing="1.6" '+
         'fill="'+T.hi+'" font-weight="800">+ ADD MY WHY</text>';
  }else{
    hub+='<text x="'+cx+'" y="'+(cy+62)+'" text-anchor="middle" font-size="8.5" letter-spacing="1.8" '+
         'fill="#fff" opacity=".55" font-weight="700">MY WHY</text>';
  }
  hub+='<circle id="hubtap" cx="'+cx+'" cy="'+cy+'" r="88" fill="transparent"/>';
  if(why){
    hub+='<g id="whyclear"><circle cx="'+(cx+62)+'" cy="'+(cy+62)+'" r="13" fill="rgba(0,0,0,.6)" stroke="rgba(255,255,255,.35)"/>'+
      '<path d="M'+(cx+57)+' '+(cy+57)+' l10 10 M'+(cx+67)+' '+(cy+57)+' l-10 10" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>';
  }
  var ptr='<g><path d="M180 20 L164 -2 L196 -2 Z" fill="'+T.hi+'"/>'+
    '<rect x="172" y="-2" width="16" height="8" rx="3" fill="'+T.hi+'"/></g>';

  document.getElementById('wheel').innerHTML=d+g+hub+ptr;

  document.getElementById('hubtap').addEventListener('click',function(){
    document.getElementById('whyFile').click()});
  var wc=document.getElementById('whyclear');
  if(wc)wc.addEventListener('click',function(ev){
    ev.stopPropagation();why=null;drop('se_why');render();toast('Photo removed')});

  var sp=document.getElementById('spinner');
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!spun&&!reduce){
    sp.style.transition='none';
    sp.style.transform='rotate('+(rot+360).toFixed(2)+'deg)';
    sp.getBoundingClientRect();
    sp.style.transition='';
    requestAnimationFrame(function(){sp.style.transform='rotate('+rot.toFixed(2)+'deg)'});
    spun=true;
  }else sp.style.transform='rotate('+rot.toFixed(2)+'deg)';
}

/* photo: square-crop and shrink before storing so it fits on the phone */
document.getElementById('whyFile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var S=360,cv=document.createElement('canvas');cv.width=S;cv.height=S;
      var side=Math.min(img.width,img.height);
      cv.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
      var url=cv.toDataURL('image/jpeg',.78);
      why=url;
      if(!store('se_why',url))toast('Shown, but too big to keep');
      else toast('That\'s your why');
      render();
    };
    img.onerror=function(){toast('Could not read that photo')};
    img.src=rd.result;
  };
  rd.onerror=function(){toast('Could not read that photo')};
  rd.readAsDataURL(f);
  e.target.value='';
});

function runLength(){var ci=cycleIdx(),t0=pattern[ci],n=0;while(n<28&&pattern[(ci+n)%28]===t0)n++;return n}
function drawStatus(){
  var ci=cycleIdx(),t0=pattern[ci],left=runLength();
  document.getElementById('stbig').textContent=NAME[t0];
  var nx=left<28?NAME[pattern[(ci+left)%28]]:'—';
  document.getElementById('stsub').textContent=
    left>=28?'Same all cycle':(left===1?'Last one — '+nx+' tomorrow':left+' days left, then '+nx);
}
function drawGrid(){
  var D=['M','T','W','T','F','S','S'],s='';
  for(var i=0;i<7;i++)s+='<div class="dow">'+D[(anchor.getDay()+6+i)%7]+'</div>';
  document.getElementById('dow').innerHTML=s;
  var w='',ci=cycleIdx();
  for(var wk=0;wk<4;wk++){
    w+='<div class="wk">Week '+(wk+1)+'</div><div class="grid">';
    for(var c=0;c<7;c++){
      var i=wk*7+c,t=pattern[i],dt=addDays(anchor,i),col=TC(t);
      w+='<div class="cell'+(i===ci?' today':'')+'" data-i="'+i+'" style="background:linear-gradient(157deg,'+
        shade(col,.32)+' 0%,'+col+' 47%,'+shade(col,-.28)+' 100%);color:'+ink(col)+'">'+
        '<span>'+GLYPH[t]+'</span><span class="dn">'+dt.getDate()+'</span></div>';
    }
    w+='</div>';
  }
  document.getElementById('weeks').innerHTML=w;
}
function render(){
  applyTheme();drawWheel();drawStatus();drawGrid();drawKey();
  var tag=document.getElementById('crewtag');
  if(crew){tag.textContent=crew;tag.style.display='block'}else tag.style.display='none';
  document.getElementById('sub').textContent='28-day cycle · day '+(cycleIdx()+1)+' of 28';
  document.getElementById('anchor').value=iso(anchor);
  document.getElementById('crew').value=crew;
  saveState();
}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on')},1900)}

function themeClick(e){var b=e.target.closest('.sw');if(!b)return;theme=b.dataset.t;drawThemes();render()}
document.getElementById('rowBase').addEventListener('click',themeClick);
document.getElementById('rowTeam').addEventListener('click',themeClick);
document.getElementById('weeks').addEventListener('click',function(e){
  var c=e.target.closest('.cell');if(!c)return;
  var i=+c.dataset.i;pattern[i]=TYPES[(TYPES.indexOf(pattern[i])+1)%TYPES.length];render()});
document.getElementById('anchor').addEventListener('change',function(e){
  if(e.target.value){anchor=parseISO(e.target.value);render()}});
document.getElementById('crew').addEventListener('input',function(e){crew=e.target.value.trim();render()});
document.getElementById('clear').addEventListener('click',function(){
  pattern=new Array(28).fill('H');render();toast('Cleared')});

function shareLink(){return location.origin+location.pathname+'#p='+pattern.join('')+'&a='+iso(anchor)+
  (crew?'&c='+encodeURIComponent(crew):'')}
document.getElementById('shareBtn').addEventListener('click',function(){
  var url=shareLink(),txt=(crew?crew+' roster':'My roster')+
    ' — opens straight in the Shift Engine, nothing to set up.\n'+url;
  if(navigator.share)navigator.share({title:'Shift Engine roster',text:txt}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('Link copied')});
  else prompt('Copy this link:',url);
});
function installSheet(fromLink){
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp/.test(navigator.userAgent),b='';
  if(fromLink)b+='<div class="warn"><b>Roster loaded.</b> Save it to your phone so it opens like an app from your home screen.</div>';
  if(inApp)b+='<div class="warn">You\'ve opened this inside another app\'s browser. Tap the <b>&#8942;</b> or <b>&#8230;</b> menu and choose <b>Open in browser</b> first, or it won\'t save.</div>';
  var steps=ios?['Tap the <b>Share</b> button at the bottom of Safari (square with an arrow)',
                 'Scroll down and tap <b>Add to Home Screen</b>',
                 'Tap <b>Add</b> — it\'s on your home screen with your roster in it']
               :['Tap the <b>&#8942;</b> menu at the top right of Chrome',
                 'Tap <b>Add to Home screen</b> (or <b>Install app</b>)',
                 'Tap <b>Install</b> — it\'s on your home screen with your roster in it'];
  steps.forEach(function(s,i){b+='<div class="step"><div class="num">'+(i+1)+'</div><div>'+s+'</div></div>'});
  b+='<div class="hint">Works with no signal — your roster is stored on the phone.</div>';
  document.getElementById('ovBody').innerHTML=b;
  document.getElementById('ov').classList.add('on');
}
document.getElementById('saveBtn').addEventListener('click',function(){installSheet(false)});
document.getElementById('ovClose').addEventListener('click',function(){document.getElementById('ov').classList.remove('on')});
document.getElementById('ov').addEventListener('click',function(e){if(e.target.id==='ov')this.classList.remove('on')});

loadState();drawThemes();render();
</script>
</body>
</html>

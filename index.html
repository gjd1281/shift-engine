<!-- ===== PERSONAL PHOTO IN THE WHEEL — paste before </body> ===== -->
<style>
  .se-hubwrap{position:relative}
  .se-hubwrap > svg, .se-hubwrap > canvas{position:relative;z-index:2}
  .se-hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    border-radius:50%;overflow:hidden;z-index:1;background:#1d1730;
    box-shadow:0 0 0 2px rgba(255,176,32,.45)}
  .se-hub.empty{box-shadow:0 0 0 1px rgba(156,147,184,.35)}
  .se-hub img{width:100%;height:100%;object-fit:cover;display:block}
  .se-hub .scrim{position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%,rgba(10,8,18,.72) 0%,rgba(10,8,18,.5) 55%,rgba(10,8,18,.72) 100%)}
  .se-hub .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.16em;color:#9C93B8;text-transform:uppercase}
  .se-photobtns{display:flex;gap:10px;justify-content:center;margin:10px 0 0}
  .se-photobtns button{background:#211a33;border:1px solid #332a4a;border-radius:999px;padding:9px 16px;
    color:#9C93B8;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;cursor:pointer}
</style>
<script>
(function(){
  /* --- if it grabs the wrong element, put your wheel's id here e.g. '#rosterWheel' --- */
  var WHEEL   = document.querySelector('#wheel, #rosterWheel, .wheel, #tab-roster svg, section svg, svg');
  var HUB_PCT = 0.56;   /* photo width as a share of the wheel — nudge to taste */
  var KEY     = 'se_wheel_photo';
  if(!WHEEL) return;

  var wrap = document.createElement('div');
  wrap.className = 'se-hubwrap';
  WHEEL.parentNode.insertBefore(wrap, WHEEL);
  wrap.appendChild(WHEEL);

  var hub = document.createElement('div');
  hub.className = 'se-hub empty';
  hub.innerHTML = '<div class="hint">Tap for your photo</div>';
  wrap.appendChild(hub);

  var input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
  document.body.appendChild(input);

  var btns = document.createElement('div');
  btns.className = 'se-photobtns';
  btns.innerHTML = '<button type="button" data-a="add">Change photo</button>' +
                   '<button type="button" data-a="rm">Remove</button>';
  wrap.parentNode.insertBefore(btns, wrap.nextSibling);
  btns.onclick = function(e){
    var a = e.target.getAttribute('data-a');
    if(a === 'add') input.click();
    if(a === 'rm'){ try{ localStorage.removeItem(KEY); }catch(x){} paint(null); }
  };

  function size(){
    var w = wrap.clientWidth || WHEEL.clientWidth;
    var d = Math.round(w * HUB_PCT);
    hub.style.width = hub.style.height = d + 'px';
  }
  window.addEventListener('resize', size);

  function paint(src){
    if(src){
      hub.className = 'se-hub';
      hub.innerHTML = '<img src="' + src + '"><div class="scrim"></div>';
    }else{
      hub.className = 'se-hub empty';
      hub.innerHTML = '<div class="hint">Tap for your photo</div>';
    }
    size();
    btns.querySelector('[data-a="rm"]').style.display = src ? '' : 'none';
  }

  /* tap the middle of the wheel — clicks on the segments still do their own thing */
  wrap.addEventListener('click', function(e){
    var r = wrap.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
    if(Math.sqrt(dx*dx + dy*dy) < (r.width * HUB_PCT)/2) input.click();
  });

  /* centre-crop to a square, shrink to 520px so it isn't a 4MB camera file */
  input.onchange = function(){
    var f = input.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var side = Math.min(im.width, im.height), out = 520;
        var c = document.createElement('canvas'); c.width = c.height = out;
        c.getContext('2d').drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,out,out);
        var data = c.toDataURL('image/jpeg', 0.82);
        try{ localStorage.setItem(KEY, data); }catch(x){}
        paint(data);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
    input.value = '';
  };

  var saved = null; try{ saved = localStorage.getItem(KEY); }catch(x){}
  paint(saved);
})();
</script>
<!-- ===== END PERSONAL PHOTO ===== -->
